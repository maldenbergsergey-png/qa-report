name: Build graphical agent
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci
        working-directory: agent
      - run: npm run check
      - run: npm test
      - run: npm run dist -- --${{ matrix.platform }}
        working-directory: agent
        env:
          CSC_LINK: ${{ secrets.AGENT_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.AGENT_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.AGENT_WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.AGENT_WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.AGENT_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.AGENT_APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.AGENT_APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: qr-report-agent-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            agent/dist/*.dmg
            agent/dist/*.exe
            agent/dist/*.deb
